server:
  port: 8081

spring:
  application:
    name: Spring AI Demo
  datasource:
    url: jdbc:h2:mem:spring-ai-demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    deepseek:
      api-key: sk-94014330085e47a5845cc2acc1a6446a
      api-base: https://api.deepseek.com
    mcp:
      server:
        enabled: false
        annotation-scanner:
          enabled: false
      client:
        enabled: false

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG

---
spring:
  config:
    activate:
      on-profile: mcp-server
  ai:
    mcp:
      server:
        enabled: true
        annotation-scanner:
          enabled: true
        name: weather-mcp-server
        version: 0.0.1
        type: SYNC
        protocol: SSE

server:
  port: 8082

---
spring:
  config:
    activate:
      on-profile: mcp-client
  ai:
    mcp:
      client:
        enabled: true
        name: weather-mcp-client
        version: 0.0.1
        type: SYNC
        request-timeout: 30s
        sse:
          connections:
            weather:
              url: http://localhost:8082
              sse-endpoint: /sse

server:
  port: 8081
