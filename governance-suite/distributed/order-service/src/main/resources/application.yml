server:
  port: 8081

spring:
  application:
    name: order-service

  cloud:
    service-registry:
      auto-registration:
        enabled: true
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: 8721
      eager: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:36379}

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20

# Seata client
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: order_tx_group
  enable-auto-data-source-proxy: false
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      order_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:localhost:8091}
  registry:
    type: file
  config:
    type: file

feign:
  sentinel:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:dev}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      compression: gzip

mybatis:
  mapper-locations: classpath*:mapper/*.xml

id:
  snowflake:
    worker-id: ${SNOWFLAKE_WORKER_ID:1}
    max-backward-ms: ${SNOWFLAKE_MAX_BACKWARD_MS:5}

app:
  admin-search:
    cursor-secret: ${ADMIN_SEARCH_CURSOR_SECRET:governance-suite-admin-search-secret}
    customer-token-secret: ${ADMIN_SEARCH_CUSTOMER_TOKEN_SECRET:${app.auth.token-secret:governance-suite-dev-secret}}
  sentinel:
    order:
      create:
        qps: 5
      create-v2:
        qps: 3
  nacos:
    retry-registration:
      enabled: true
      max-attempts: 30
      retry-interval-ms: 2000
  thread-pool:
    io:
      core-size: 32
      max-size: 64
      queue-capacity: 2000
      keep-alive-seconds: 60
      thread-name-prefix: io-exec-
    cpu:
      core-size: 8
      max-size: 8
      queue-capacity: 500
      keep-alive-seconds: 60
      thread-name-prefix: cpu-exec-
    biz:
      core-size: 16
      max-size: 32
      queue-capacity: 1000
      keep-alive-seconds: 60
      thread-name-prefix: biz-exec-
    scheduled:
      pool-size: 8
      thread-name-prefix: scheduled-exec-

spring.cloud.openfeign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        contract: org.springframework.cloud.openfeign.support.SpringMvcContract

# Bulkhead 配置
bulkhead:
  enabled: true
  default:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 20
    timeout-seconds: 3
    keep-alive-seconds: 60
  services:
    inventory-service:
      core-pool-size: 8
      max-pool-size: 15
      queue-capacity: 30
      timeout-seconds: 5
    payment-service:
      core-pool-size: 10
      max-pool-size: 20
      queue-capacity: 50
      timeout-seconds: 10
