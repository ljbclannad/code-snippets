server:
  port: 8085
spring:
  application:
    name: product-service
  datasource:
    url: ${PRODUCT_DB_URL:jdbc:mysql://localhost:3306/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${PRODUCT_DB_USERNAME:root}
    password: ${PRODUCT_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  cloud:
    nacos:
      discovery:
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        enabled: false
app:
  auth:
    token-secret: ${AUTH_TOKEN_SECRET:governance-suite-dev-secret}
  product:
    admin-user-ids: ${PRODUCT_ADMIN_USER_IDS:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
