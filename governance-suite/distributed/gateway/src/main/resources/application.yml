server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: localhost
      port: 36379
  cloud:
    service-registry:
      auto-registration:
        enabled: true
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
    gateway:
      discovery:
        locator:
          enabled: ${GATEWAY_DISCOVERY_ENABLED:true}
          lower-case-service-id: true
      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@ipKeyResolver}"
            redis-rate-limiter.replenishRate: ${gateway.rate-limit.replenish-rate:5}
            redis-rate-limiter.burstCapacity: ${gateway.rate-limit.burst-capacity:10}
            redis-rate-limiter.requestedTokens: 1
      routes:
        - id: user
          uri: ${USER_SERVICE_URI:lb://user-service}
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=2
        - id: block-ip
          uri: no://op
          order: -100
          predicates:
            - RemoteAddr=${gateway.block-ip:10.10.10.10}/32
            - Path=/**
          filters:
            - SetStatus=403
        - id: order
          uri: ${ORDER_SERVICE_URI:lb://order-service}
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=2
        - id: payment
          uri: ${PAYMENT_SERVICE_URI:lb://payment-service}
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=2
        - id: block-payment-rebuild
          uri: no://op
          order: -101
          predicates:
            - Path=/api/payment/internal/rebuild/**,/payment-service/internal/rebuild/**
          filters:
            - SetStatus=403
        - id: search
          uri: ${SEARCH_SERVICE_URI:lb://search-service}
          predicates:
            - Path=/api/search/**
          filters:
            - StripPrefix=2
        - id: product
          uri: ${PRODUCT_SERVICE_URI:lb://product-service}
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=2
        - id: inventory
          uri: ${INVENTORY_SERVICE_URI:lb://inventory-service}
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=2
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/api/appointment/**
        - id: appointment-ws
          uri: lb:ws://appointment-service
          predicates:
            - Path=/ws/appointment,/ws/appointment/**

# Gateway 自带的 RedisRateLimiter（演示用）
# 生产上建议：它负责网关级粗粒度限流，Sentinel 负责细粒度（链路/热点/熔断降级）
# 已通过 default-filters 对全部路由启用，维度为客户端 IP。

gateway:
  rate-limit:
    replenish-rate: 5
    burst-capacity: 10

feign:
  sentinel:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:dev}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      compression: gzip

logging:
  level:
    org.springframework.cloud.gateway: INFO

app:
  auth:
    token-secret: ${AUTH_TOKEN_SECRET:governance-suite-dev-secret}
    token-ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:7200}
  nacos:
    retry-registration:
      enabled: true
      max-attempts: 30
      retry-interval-ms: 2000

# 挂号接口限流配置
appointment:
  rate-limit:
    enabled: true
    target-path: /api/appointment/grab
    # 热门科室限流配置
    hot-dept:
      replenish-rate: 20
      burst-capacity: 40
    # 普通科室限流配置
    normal-dept:
      replenish-rate: 10
      burst-capacity: 20
    # 用户级限流配置
    user:
      replenish-rate: 2
      burst-capacity: 5
    # 热门科室缓存配置
    hot-dept-cache:
      max-size: 1000
      expire-after-write-seconds: 60
