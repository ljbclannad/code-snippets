server:
  port: 8082

spring:
  application:
    name: payment-service

  cloud:
    service-registry:
      auto-registration:
        enabled: true
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: 8722
      eager: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:36379}

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    publisher-confirm-type: correlated

  shardingsphere:
    datasource:
      names: ds0
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/payment_db?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        username: ${MYSQL_USER:root}
        password: ${MYSQL_PASS:root}
    rules:
      sharding:
        tables:
          t_payment:
            actual-data-nodes: ds0.t_payment_${0..1}
            table-strategy:
              standard:
                sharding-column: user_id
                sharding-algorithm-name: pay-inline
        sharding-algorithms:
          pay-inline:
            type: INLINE
            props:
              algorithm-expression: t_payment_${user_id % 2}
    props:
      sql-show: true

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: payment_tx_group
  enable-auto-data-source-proxy: false
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      payment_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:localhost:8091}
  registry:
    type: file
  config:
    type: file

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:dev}
    defaults:
      enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4317
      compression: gzip

app:
  auth:
    token-secret: ${AUTH_TOKEN_SECRET:governance-suite-dev-secret}
    token-ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:7200}
  nacos:
    retry-registration:
      enabled: true
      max-attempts: 30
      retry-interval-ms: 2000

id:
  snowflake:
    worker-id: ${SNOWFLAKE_WORKER_ID:2}
    max-backward-ms: ${SNOWFLAKE_MAX_BACKWARD_MS:5}

lab:
  fail:
    prepare: ${LAB_FAIL_PAYMENT_PREPARE:false}
    confirm: ${LAB_FAIL_PAYMENT_CONFIRM:false}
