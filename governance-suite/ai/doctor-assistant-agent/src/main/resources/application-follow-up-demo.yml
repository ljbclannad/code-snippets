server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        name: FOLLOW_UP_DOCTOR_DEMO
        same-site: strict
        http-only: true

follow-up-demo:
  role: DOCTOR
  account: demo-doctor
  password: ${FOLLOW_UP_DEMO_DOCTOR_PASSWORD}

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${AI_MYSQL_PORT:3306}/doctor_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  cloud:
    nacos:
      discovery:
        enabled: false
  data:
    redis:
      host: 127.0.0.1

agent:
  follow-up-reminder:
    doctors:
      "[demo-patient]": demo-doctor
