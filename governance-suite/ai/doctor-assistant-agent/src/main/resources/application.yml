spring:
  application:
    name: doctor-assistant-agent

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:${AI_MIDDLEWARE_HOST:175.27.242.127}:8848}
        namespace: ${NACOS_NAMESPACE:ai-local}
        group: DEFAULT_GROUP

  # 数据源配置
  datasource:
    url: jdbc:mysql://${AI_MYSQL_HOST:${AI_MIDDLEWARE_HOST:175.27.242.127}}:${AI_MYSQL_PORT:3306}/doctor_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${AI_DOCTOR_MYSQL_USERNAME:doctor_app}
    password: ${AI_DOCTOR_MYSQL_PASSWORD:${DOCTOR_DB_PASSWORD:${MYSQL_PASSWORD:}}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:${AI_MIDDLEWARE_HOST:175.27.242.127}}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # Spring AI 配置（DeepSeek）
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2000

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.health.agent.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Agent配置
agent:
  follow-up-reminder:
    service-token: ${FOLLOW_UP_SERVICE_TOKEN:}
    doctors: {} # 患者 ID 到责任医生 ID 的映射，普通 Agent 和高风险随访共用
  max-steps: 15
  session-timeout: 3600
  task-expire-hours: 24
  use-mock: false
  sse:
    timeout-millis: 120000
    executor-pool-size: 8
  access:
    max-requests-per-minute: 30
    max-sse-connections: 32
  prompt-context:
    max-slots: 12
    max-slot-chars: 240
    max-total-chars: 2400
  tool-timeout-millis: 3000
  tool-executor:
    core-pool-size: 8
    max-pool-size: 16
    queue-capacity: 64
    keep-alive-millis: 60000
  protocol-repair-attempts: 1
  deepseek:
    model: deepseek-chat
    temperature: 0.7
    max-tokens: 2000
    request-timeout: 5s
    max-retries: 2
    executor:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 32
      keep-alive-millis: 60000
  weight-plateau:
    window-days: 14
    max-weight-change-kg: 0.5
    recent-trend-days: 7
    recent-downward-threshold-kg: 0.2
  adherence:
    analysis-window-days: 14
    min-weight-records: 3

# 平台化后的 doctor agent 配置分层
doctor:
  agent:
    knowledge-base:
      enabled: true
      base-url: http://localhost:8103
      kb-id: medical-default
      top-k: 3
      similarity-threshold: 0.2
      use-rewrite: true
      rerank: true
      hybrid-search: true
      business-domain: medical
      applicable-scope: doctor_assistant
      trust-level: HIGH
      connect-timeout-seconds: 5
      read-timeout-seconds: 10
    platform:
      workflow-id: doctor-patient-task-v1
      platform-agent-id: doctor-assistant-agent
      tool-version: doctor-toolkit-v1
      fallback-to-template-on-agent-error: true
      allowed-tools: {}
    runtime:
      max-steps: 15
      use-mock: false
      protocol-repair-attempts: 1
    safety:
      weight-plateau:
        window-days: 14
        max-weight-change-kg: 0.5
        recent-trend-days: 7
        recent-downward-threshold-kg: 0.2
      privacy:
        enabled: true
      evidence-retention:
        enabled: true
        max-records: 12
        max-payload-records: 4
        max-summary-chars: 200
        keep-audit-only-payload: false
      rules:
        high-risk-min-supporting-evidence: 2
        high-risk-min-evidence-sources: 1
        emergency-keywords:
          - 胸痛
          - 呼吸困难
          - 胸闷
          - 心悸
          - 晕厥
          - 昏迷
          - 抽搐
          - 便血
          - 呕血
          - 自杀
          - 轻生

# Milvus 向量数据库配置
milvus:
  enabled: false # 默认关闭，需要时启用
  host: ${AI_MIDDLEWARE_HOST:175.27.242.127}
  port: 19530
  collection-name: medical_cases
  dimension: 768

# Embedding 配置
embedding:
  use-mock: true # true: 使用 Mock Embedding；false: 必须接入真实 Provider，否则请求会显式失败

# 向量检索配置
vector:
  search:
    top-k: 5 # 默认返回前5个相似病例

# 服务器配置
server:
  port: 8088
  servlet:
    context-path: /

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[agent.execution.duration]": true
        "[tool.execution.duration]": true
        "[vector.search.duration]": true
        "[vector.embedding.duration]": true
      percentiles:
        "[http.server.requests]": [0.5, 0.95, 0.99]
        "[agent.execution.duration]": [0.5, 0.95, 0.99]
        "[tool.execution.duration]": [0.5, 0.95, 0.99]
        "[vector.search.duration]": [0.5, 0.95, 0.99]
        "[vector.embedding.duration]": [0.5, 0.95, 0.99]
      slo:
        "[http.server.requests]": [100ms, 300ms, 500ms, 1s, 2s, 5s]
        "[agent.execution.duration]": [1s, 2s, 3s, 5s, 8s, 13s]
        "[tool.execution.duration]": [50ms, 100ms, 200ms, 500ms, 1s, 2s, 3s]
        "[vector.search.duration]": [50ms, 100ms, 200ms, 500ms, 1s, 2s, 3s]
        "[vector.embedding.duration]": [50ms, 100ms, 200ms, 500ms, 1s, 2s, 3s]
    export:
      prometheus:
        enabled: true

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

# 日志配置
logging:
  level:
    root: INFO
    com.health.agent: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.web.client: DEBUG
