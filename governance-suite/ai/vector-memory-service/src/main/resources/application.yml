server:
  port: 8102

spring:
  application:
    name: vector-memory-service

  # Nacos 服务发现
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:${AI_MIDDLEWARE_HOST:175.27.242.127}:8848}
        namespace: ${NACOS_NAMESPACE:ai-local}
        group: DEFAULT_GROUP

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:${AI_MIDDLEWARE_HOST:175.27.242.127}}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # RabbitMQ 配置
  rabbitmq:
    host: ${AI_MIDDLEWARE_HOST:175.27.242.127}
    port: 5672
    username: ${RABBITMQ_USERNAME:governance_app}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${AI_MYSQL_HOST:${AI_MIDDLEWARE_HOST:175.27.242.127}}:${AI_MYSQL_PORT:3306}/governance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${AI_MYSQL_USERNAME:governance_app}
    password: ${AI_MYSQL_PASSWORD:${GOVERNANCE_DB_PASSWORD:}}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Spring AI Milvus 配置
  ai:
    vectorstore:
      milvus:
        client:
          host: ${AI_MIDDLEWARE_HOST:175.27.242.127}
          port: 19530
        database-name: default
        collection-name: user_memory_vectors_v3 # v3: 1024-dim (text-embedding-v3)
        embedding-dimension: 1024
        index-type: IVF_FLAT
        metric-type: COSINE # COSINE preferred over L2 for text embeddings (measures angular similarity)
        nlist: 1024

    # 通义千问 Embedding 配置
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
      embedding:
        options:
          model: text-embedding-v3

    # DeepSeek 配置 (OpenAI 兼容)
    openai:
      api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-pro
          temperature: 0.7
          max-tokens: 2000

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lx.governance.vectormemory.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:dev}
    enable:
      jvm: true
      process: true
      system: true
      logback: true
      tomcat: true

# 日志配置
logging:
  level:
    com.lx.governance.vectormemory: INFO
    org.springframework.ai: DEBUG
    org.springframework.web.client: DEBUG
    io.milvus: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# 记忆检索配置
memory:
  lifecycle:
    retention:
      symptom-ttl-days: 30
      preference-inactivity-days: 180
      fact-inactivity-days: 365
      low-value-source-threshold: 1
    decay:
      penalty-factor: 0.25
      default-decay-score: 0.35
      scan-limit: 100
    cleanup:
      archive-after-decay-days: 30
      delete-after-archive-days: 90
    compaction:
      min-evidence-count: 2
      min-source-count: 2
      long-cycle-event-days: 14
      scan-limit: 100
    task:
      fixed-delay-ms: 300000
      initial-delay-ms: 90000
  retrieval:
    hybrid:
      keyword-enabled: true
      fetch-multiplier: 2
      weights:
        # 三路召回的默认初始权重：
        # - vector: 语义最准，保留原始相似度并允许 scale 微调
        # - redis: 偏近期上下文，给一个能过上游阈值的基础分，再叠加少量置信度
        # - keyword: 偏精确命中，基础分略低于 redis，通过 title/key/content 命中补分
        redis-base: 0.78
        redis-confidence-bonus: 0.12
        keyword-base: 0.74
        keyword-title-bonus: 0.08
        keyword-key-bonus: 0.06
        keyword-content-bonus: 0.05
        keyword-confidence-bonus: 0.08
        vector-scale: 1.0

    # 是否启用 Rerank（语义重排序）
    rerank:
      enabled: true
      # provider:
      # - embedding: 继续使用当前 embedding 二次打分
      # - bge-http: 调用外部 BGE Rerank 服务
      provider: ${MEMORY_RERANK_PROVIDER:embedding}
      # Rerank 策略: full（全量重排序）, partial（仅对 Redis 缓存记忆重排序）
      strategy: partial
      # 外部 Rerank 服务失败时，是否自动降级到 embedding 二次打分
      fallback-to-embedding: true
      remote:
        base-url: ${MEMORY_RERANK_BASE_URL:http://localhost:9997}
        path: ${MEMORY_RERANK_PATH:/v1/rerank}
        model: ${MEMORY_RERANK_MODEL:bge-reranker-v2-m3}

    # 去重配置
    deduplication:
      # 语义去重：相似度 >= 阈值视为重复
      semantic-enabled: true
      semantic-threshold: 0.95

  # Redis 去重配置
  redis:
    dedup:
      enabled: true

milvus:
  # 默认保留已有 collection 和 index，避免每次启动都删库重建并触发首次建索引告警。
  reset-collections-on-startup: false
