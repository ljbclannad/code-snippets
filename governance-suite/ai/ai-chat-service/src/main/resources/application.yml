server:
  port: 8100

spring:
  application:
    name: ai-chat-service
  datasource:
    url: jdbc:mysql://localhost:3306/governance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          multiplier: 2
  data:
    redis:
      host: localhost
      port: 36379
      timeout: 3000ms
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 30s
  # Spring AI Configuration (使用 OpenAI 兼容客户端连接 DeepSeek)
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      connect-timeout: 5s
      read-timeout: 60s
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
          temperature: 0.7
          max-tokens: 2000

# MyBatis Plus Configuration
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.lx.governance.aichat.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Service Timeout Configuration
service:
  timeout:
    user-profile: 5000
    vector-memory: 5000

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    elasticsearch:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:dev}
    enable:
      jvm: true
      process: true
      system: true
      logback: true
      tomcat: true

# Logging Configuration
logging:
  level:
    com.lx.governance.aichat: INFO
    org.springframework.web: INFO
    org.springframework.amqp: INFO
    org.springframework.web.servlet.resource.ResourceHttpRequestHandler: ERROR

# AI 上下文管理配置
ai:
  context:
    # Token 预算配置（基础配置，会根据对话复杂度动态调整）
    total-budget: 4000 # 总预算
    user-message-reserve: 500 # 为用户消息预留

    # 各部分预算分配（按优先级）
    # 注意：这些是基础预算，实际使用时会根据 SessionContext.complexity 动态调整
    # - simple: 各部分预算 * 0.5-0.75（简单对话，减少上下文）
    # - medium: 使用基础预算（默认）
    # - complex: 各部分预算 * 1.25-1.5（复杂对话，增加上下文）
    core-profile-budget: 800 # 核心画像（必须）
    relevant-memories-budget: 1200 # 相关记忆（重要）
    conversation-history-budget: 600 # 对话历史（重要）
    extended-profile-budget: 400 # 扩展画像（可选）

    # 记忆检索配置
    memory:
      max-count: 10 # 最多检索数量
      similarity-threshold: 0.7 # 相似度阈值
      short-term-days: 3 # 短期记忆天数
      mid-term-days: 30 # 中期记忆天数
      enable-deduplication: true # 启用去重
      rewrite:
        enabled: true # 启用 LLM Query Rewrite
        complex-only: true # 复杂问题仍强制走 LLM Rewrite
        contextual-signals-enabled: true # 简单问题也可按上下文依赖信号触发
        short-message-threshold: 18 # 短追问判定阈值
        temperature: 0.0 # 尽量稳定输出
        max-tokens: 64 # Rewrite 输出上限
        max-query-length: 80 # 检索 query 最大长度

      # 智能过滤配置（混合方案：规则 + 意图分析）
      smart-filter:
        enabled: true # 是否启用智能过滤
        min-message-length: 3 # 最小消息长度
        skip-simple-complexity: true # 是否跳过 simple 复杂度的消息

    # 对话历史配置
    conversation:
      max-rounds: 5 # 最多保留轮数
      enabled: true # 是否启用对话历史

    # 告警配置
    alert:
      enabled: true # 是否启用告警
      prompt-tokens-threshold: 6000 # Prompt tokens 告警阈值
      total-tokens-threshold: 28000 # Total tokens 告警阈值

# 对话历史同步配置
chat:
  history:
    sync:
      queue: chat.history.sync.queue
      exchange: chat.history.sync.exchange
      routing-key: chat.history.sync

# Resilience4j 配置
resilience4j:
  circuitbreaker:
    instances:
      sessionContext:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        minimum-number-of-calls: 5

  retry:
    instances:
      sessionContext:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2

# 画像补全配置
profile-completion:
  enabled: true

  # 追问控制
  follow-up:
    max-rounds: 3 # 最多追问轮数
    max-questions-per-round: 2 # 每轮最多追问问题数
    timeout-minutes: 10 # 追问超时时间（分钟）

  # 规则配置文件路径
  rules-config: classpath:profile-completion-rules.yml

ai-chat:
  agent:
    enabled: false
    base-url: ${DOCTOR_ASSISTANT_AGENT_BASE_URL:http://localhost:8088}
    timeout-ms: 15000
    auto-fallback-to-direct-chat: true
    doctor-pilot-mode: true
    patient-conservative-readonly-mode: true
    enabled-task-types:
      - PATIENT_FOLLOW_UP_ANALYSIS
      - RISK_STRATIFICATION_AND_ESCALATION
      - NEXT_FOLLOW_UP_ACTION_RECOMMENDATION
    enabled-group-ids: []
    circuit-breaker-open: false
  concurrency:
    conversation-lock-timeout-ms: 0

  # 聊天历史推荐配置
  chat-history:
    auto-recommend-enabled: true
    recommend-count: 3

  # 配额管理配置
  quota:
    enabled: false
    default-type: daily # 默认配额类型: daily, monthly, total
    default-limit: 100000 # 默认配额限制（tokens）

  # 降级配置
  degradation:
    enabled: true # 是否启用降级功能
    auto-enabled: true # 是否启用自动降级
    check-interval-seconds: 10 # 降级检查间隔（秒）

    # 降级阈值配置
    thresholds:
      light:
        cpu-usage: 70.0
        memory-usage: 70.0
        concurrent-requests: 100
        error-rate: 5.0
        avg-response-time: 3000

      medium:
        cpu-usage: 80.0
        memory-usage: 80.0
        concurrent-requests: 200
        error-rate: 10.0
        avg-response-time: 5000

      heavy:
        cpu-usage: 85.0
        memory-usage: 85.0
        concurrent-requests: 300
        error-rate: 20.0
        avg-response-time: 8000

      critical:
        cpu-usage: 90.0
        memory-usage: 90.0
        concurrent-requests: 500
        error-rate: 30.0
        avg-response-time: 10000

      circuit-break:
        cpu-usage: 95.0
        memory-usage: 95.0
        concurrent-requests: 1000
        error-rate: 50.0
        avg-response-time: 15000

    # 恢复阈值配置
    recovery:
      factor: 0.8 # 恢复因子（需降到降级阈值的 80%）
      duration-seconds: 30 # 持续时间（秒）
