server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        name: FOLLOW_UP_PATIENT_DEMO
        same-site: strict
        http-only: true

follow-up-demo:
  role: PATIENT
  account: demo-patient
  password: ${FOLLOW_UP_DEMO_PATIENT_PASSWORD}

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${AI_MYSQL_PORT:3306}/governance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  cloud:
    nacos:
      discovery:
        enabled: false
  data:
    redis:
      host: 127.0.0.1
  rabbitmq:
    host: 127.0.0.1
  elasticsearch:
    uris: http://127.0.0.1:9200
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:follow-up-demo-placeholder}

ai-chat:
  agent:
    base-url: http://127.0.0.1:${FOLLOW_UP_DEMO_DOCTOR_PORT:8088}
