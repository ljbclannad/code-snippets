server:
  port: 8101

spring:
  application:
    name: user-profile-service

  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_ADDR:${AI_MIDDLEWARE_HOST:175.27.242.127}:8848}
        namespace: ${NACOS_NAMESPACE:ai-local}

  data:
    redis:
      host: ${REDIS_HOST:${AI_MIDDLEWARE_HOST:175.27.242.127}}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
        shutdown-timeout: 100ms
      timeout: 5000ms

  rabbitmq:
    host: ${AI_MIDDLEWARE_HOST:175.27.242.127}
    port: 5672
    username: ${RABBITMQ_USERNAME:governance_app}
    password: ${RABBITMQ_PASSWORD:}

  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5分钟
  
  datasource:
    url: jdbc:mysql://${AI_MYSQL_HOST:${AI_MIDDLEWARE_HOST:175.27.242.127}}:${AI_MYSQL_PORT:3306}/governance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${AI_MYSQL_USERNAME:governance_app}
    password: ${AI_MYSQL_PASSWORD:${GOVERNANCE_DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:dev}
    enable:
      jvm: true
      process: true
      system: true
      logback: true
      tomcat: true

logging:
  level:
    com.lx.governance.profile: INFO
