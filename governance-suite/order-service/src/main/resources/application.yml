server:
  port: 8081

spring:
  application:
    name: order-service

  cloud:
    service-registry:
      auto-registration:
        enabled: true
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: 8721
      eager: true

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:36379}

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20

  shardingsphere:
    datasource:
      names: ds0
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/order_db?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        username: ${MYSQL_USER:root}
        password: ${MYSQL_PASS:root}
    rules:
      sharding:
        tables:
          t_order:
            actual-data-nodes: ds0.t_order_${0..1}
            table-strategy:
              standard:
                sharding-column: order_no
                sharding-algorithm-name: order-inline
          t_outbox:
            actual-data-nodes: ds0.t_outbox
          t_seckill_order_guard:
            actual-data-nodes: ds0.t_seckill_order_guard
        sharding-algorithms:
          order-inline:
            type: INLINE
            props:
              algorithm-expression: t_order_${Math.abs(order_no.hashCode()) % 2}
    props:
      sql-show: true

# Seata client
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: order_tx_group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      order_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:localhost:8091}
  registry:
    type: file
  config:
    type: file

feign:
  sentinel:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

mybatis:
  mapper-locations: classpath*:mapper/*.xml

id:
  snowflake:
    worker-id: ${SNOWFLAKE_WORKER_ID:1}
    max-backward-ms: ${SNOWFLAKE_MAX_BACKWARD_MS:5}

app:
  nacos:
    retry-registration:
      enabled: true
      max-attempts: 30
      retry-interval-ms: 2000
  thread-pool:
    io:
      core-size: 32
      max-size: 64
      queue-capacity: 2000
      keep-alive-seconds: 60
      thread-name-prefix: io-exec-
    cpu:
      core-size: 8
      max-size: 8
      queue-capacity: 500
      keep-alive-seconds: 60
      thread-name-prefix: cpu-exec-
    biz:
      core-size: 16
      max-size: 32
      queue-capacity: 1000
      keep-alive-seconds: 60
      thread-name-prefix: biz-exec-
    scheduled:
      pool-size: 8
      thread-name-prefix: scheduled-exec-
