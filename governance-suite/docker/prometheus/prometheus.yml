global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'governance-suite'
    environment: 'development'

rule_files:
  - '/etc/prometheus/alerts/*.yml'

scrape_configs:
  # AI Chat Service 监控
  - job_name: 'ai-chat-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8100']
        labels:
          application: 'ai-chat-service'
          service: 'ai-chat'

  # Gateway 监控
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'gateway'
          service: 'gateway'

  # User Service 监控
  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8084']
        labels:
          application: 'user-service'
          service: 'user'

  # Order Service 监控
  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          application: 'order-service'
          service: 'order'

  # Payment Service 监控
  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          application: 'payment-service'
          service: 'payment'

  # Inventory Service 监控
  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          application: 'inventory-service'
          service: 'inventory'

  # Outbox Consumer 监控
  - job_name: 'outbox-consumer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8090']
        labels:
          application: 'outbox-consumer'
          service: 'outbox'

  # Doctor Assistant Agent 监控
  - job_name: 'doctor-assistant-agent'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8088']
        labels:
          application: 'doctor-assistant-agent'
          service: 'agent'

  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
