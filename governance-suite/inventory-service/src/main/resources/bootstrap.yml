spring:
  application:
    name: inventory-service
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true

        shared-configs:
          - data-id: common.yml
            group: DEFAULT_GROUP
            refresh: true
