name: governance-suite

services:
    mysql:
        image: example/mysql:8.0.30
        pull_policy: never
        container_name: gov-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            TZ: Asia/Shanghai
        ports:
            - "3306:3306"
        volumes:
            - ./sql:/docker-entrypoint-initdb.d:ro
            - gov_mysql_data:/var/lib/mysql
            - ./docker/mysql/master.cnf:/etc/mysql/conf.d/master.cnf:ro
        command:
            - "--character-set-server=utf8mb4"
            - "--collation-server=utf8mb4_unicode_ci"
            - "--default-time-zone=+08:00"

    mysql-slave1:
        image: example/mysql:8.0.30
        pull_policy: never
        container_name: gov-mysql-slave1
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            TZ: Asia/Shanghai
        ports:
            - "3307:3306"
        volumes:
            - gov_mysql_slave1_data:/var/lib/mysql
            - ./docker/mysql/slave1.cnf:/etc/mysql/conf.d/slave.cnf:ro
        command:
            - "--character-set-server=utf8mb4"
            - "--collation-server=utf8mb4_unicode_ci"
            - "--default-time-zone=+08:00"
        depends_on:
            - mysql

    mysql-slave2:
        image: example/mysql:8.0.30
        pull_policy: never
        container_name: gov-mysql-slave2
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            TZ: Asia/Shanghai
        ports:
            - "3308:3306"
        volumes:
            - gov_mysql_slave2_data:/var/lib/mysql
            - ./docker/mysql/slave2.cnf:/etc/mysql/conf.d/slave.cnf:ro
        command:
            - "--character-set-server=utf8mb4"
            - "--collation-server=utf8mb4_unicode_ci"
            - "--default-time-zone=+08:00"
        depends_on:
            - mysql

    redis:
        image: redis:latest
        pull_policy: never
        container_name: gov-redis
        restart: unless-stopped
        ports:
            - "36379:6379"
        volumes:
            - gov_redis_data:/data

    rabbitmq:
        image: rabbitmq:3.13-management
        container_name: gov-rabbitmq
        restart: unless-stopped
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - gov_rabbitmq_data:/var/lib/rabbitmq

    nacos:
        image: nacos/nacos-server:v2.5.1
        pull_policy: never
        container_name: gov-nacos
        restart: unless-stopped
        environment:
            MODE: standalone
            PREFER_HOST_MODE: hostname
            TZ: Asia/Shanghai
            SPRING_DATASOURCE_PLATFORM: mysql
            MYSQL_SERVICE_HOST: mysql
            MYSQL_SERVICE_PORT: 3306
            MYSQL_SERVICE_DB_NAME: nacos
            MYSQL_SERVICE_USER: root
            MYSQL_SERVICE_PASSWORD: root
            MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        ports:
            - "8848:8848"
            - "9848:9848"
            - "9849:9849"
        depends_on:
            - mysql

    seata-server:
        image: seataio/seata-server:1.7.1
        container_name: gov-seata
        restart: unless-stopped
        ports:
            - "8091:8091"
        environment:
            SEATA_IP: seata-server
            SEATA_PORT: 8091
        depends_on:
            - mysql

    sentinel:
        image: bladex/sentinel-dashboard:1.8.6
        platform: linux/amd64
        container_name: gov-sentinel
        restart: unless-stopped
        ports:
            - "8858:8858"
        environment:
            JAVA_OPTS: "-Dserver.port=8858 -Dproject.name=sentinel-dashboard"

    # Milvus 依赖的 etcd
    etcd:
        image: quay.io/coreos/etcd:v3.5.5
        container_name: gov-etcd
        restart: unless-stopped
        environment:
            - ETCD_AUTO_COMPACTION_MODE=revision
            - ETCD_AUTO_COMPACTION_RETENTION=1000
            - ETCD_QUOTA_BACKEND_BYTES=4294967296
            - ETCD_SNAPSHOT_COUNT=50000
        volumes:
            - gov_etcd_data:/etcd
        command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
        healthcheck:
            test: ["CMD", "etcdctl", "endpoint", "health"]
            interval: 30s
            timeout: 10s
            retries: 3

    # Milvus 依赖的 MinIO
    minio:
        image: minio/minio:RELEASE.2023-03-20T20-16-18Z
        container_name: gov-minio
        restart: unless-stopped
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - gov_minio_data:/minio_data
        command: minio server /minio_data --console-address ":9001"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 30s
            timeout: 10s
            retries: 3

    # Milvus 向量数据库
    milvus:
        image: milvusdb/milvus:v2.3.4
        container_name: gov-milvus
        restart: unless-stopped
        environment:
            ETCD_ENDPOINTS: etcd:2379
            MINIO_ADDRESS: minio:9000
            MINIO_ACCESS_KEY_ID: minioadmin
            MINIO_SECRET_ACCESS_KEY: minioadmin
        ports:
            - "19530:19530"
            - "9091:9091"
        volumes:
            - gov_milvus_data:/var/lib/milvus
        command: ["milvus", "run", "standalone"]
        depends_on:
            etcd:
                condition: service_healthy
            minio:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
            interval: 30s
            timeout: 10s
            retries: 3

    elasticsearch:
        image: elasticsearch:8.11.0
        container_name: gov-elasticsearch
        restart: unless-stopped
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
            - TZ=Asia/Shanghai
        ports:
            - "9200:9200"
            - "9300:9300"
        volumes:
            - gov_es_data:/usr/share/elasticsearch/data
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3

    kibana:
        image: kibana:8.11.0
        container_name: gov-kibana
        restart: unless-stopped
        environment:
            - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
            - TZ=Asia/Shanghai
        ports:
            - "5601:5601"
        depends_on:
            elasticsearch:
                condition: service_healthy

    logstash:
        image: logstash:8.11.0
        container_name: gov-logstash
        restart: unless-stopped
        environment:
            - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
            - TZ=Asia/Shanghai
        ports:
            - "50000:50000"
            - "9600:9600"
        volumes:
            - ./docker/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
            - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
        depends_on:
            elasticsearch:
                condition: service_healthy

volumes:
    gov_mysql_data:
    gov_mysql_slave1_data:
    gov_mysql_slave2_data:
    gov_redis_data:
    gov_rabbitmq_data:
    gov_etcd_data:
    gov_minio_data:
    gov_milvus_data:
    gov_es_data:
