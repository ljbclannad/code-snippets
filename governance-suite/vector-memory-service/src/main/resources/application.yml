server:
  port: 8102

spring:
  application:
    name: vector-memory-service

  # Nacos 服务发现
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:36379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # RabbitMQ 配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/governance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Spring AI Milvus 配置
  ai:
    vectorstore:
      milvus:
        client:
          host: localhost
          port: 19530
        database-name: default
        collection-name: user_memory_vectors_v3  # v3: 1024-dim (text-embedding-v3)
        embedding-dimension: 1024
        index-type: IVF_FLAT
        metric-type: COSINE  # COSINE preferred over L2 for text embeddings (measures angular similarity)
        nlist: 1024

    # 通义千问 Embedding 配置
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
      embedding:
        options:
          model: text-embedding-v3

    # DeepSeek 配置 (OpenAI 兼容)
    openai:
      api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
      base-url: https://api.deepseek.com/v1
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2000

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lx.governance.vectormemory.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# 日志配置
logging:
  level:
    com.lx.governance.vectormemory: INFO
    org.springframework.ai: DEBUG
    org.springframework.web.client: DEBUG
    io.milvus: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# 记忆检索配置
memory:
  retrieval:
    # 是否启用 Rerank（语义重排序）
    rerank:
      enabled: true
      # Rerank 策略: full（全量重排序）, partial（仅对 Redis 缓存记忆重排序）
      strategy: partial

    # 去重配置
    deduplication:
      # 语义去重：相似度 >= 阈值视为重复
      semantic-enabled: true
      semantic-threshold: 0.95

  # Redis 去重配置
  redis:
    dedup:
      enabled: true
