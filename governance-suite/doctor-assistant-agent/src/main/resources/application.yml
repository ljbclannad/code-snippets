spring:
  application:
    name: doctor-assistant-agent

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/doctor_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis配置
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.health.agent.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Spring AI 配置（DeepSeek）
spring:
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2000

# Agent配置
agent:
  max-steps: 15
  session-timeout: 3600
  task-expire-hours: 24
  use-mock: false
  deepseek:
    model: deepseek-chat
    temperature: 0.7
    max-tokens: 2000

# Milvus 向量数据库配置
milvus:
  enabled: false  # 默认关闭，需要时启用
  host: localhost
  port: 19530
  collection-name: medical_cases
  dimension: 768

# Embedding 配置
embedding:
  use-mock: true  # 使用 Mock Embedding（测试用）
  # 生产环境应该使用真实的 Embedding 模型

# 向量检索配置
vector:
  search:
    top-k: 5  # 默认返回前5个相似病例

# 服务器配置
server:
  port: 8088
  servlet:
    context-path: /

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

# 日志配置
logging:
  level:
    root: INFO
    com.health.agent: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
