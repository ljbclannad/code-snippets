global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'doctor-assistant'
    environment: 'development'

scrape_configs:
  # Doctor Assistant Agent 应用监控
  - job_name: 'doctor-assistant-agent'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['doctor-assistant-agent:8088']
        labels:
          application: 'doctor-assistant-agent'
          service: 'agent'

  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
