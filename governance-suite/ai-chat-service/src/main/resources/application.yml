server:
  port: 8103

spring:
  application:
    name: ai-chat-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          multiplier: 2
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 30s
  # Spring AI Configuration (使用 OpenAI 兼容客户端连接 DeepSeek)
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com/v1
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0.7
          max-tokens: 2000

# Dify API Configuration (已注释，保留配置)
dify:
  api:
    base-url: ${DIFY_API_BASE_URL:https://api.dify.ai/v1}
    key: ${DIFY_API_KEY:your-dify-api-key}
    timeout: 30000

# Service Timeout Configuration
service:
  timeout:
    user-profile: 5000
    vector-memory: 5000
    dify-api: 30000

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    elasticsearch:
      enabled: true
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    com.lx.governance.aichat: INFO
    org.springframework.web: INFO
    org.springframework.amqp: INFO

# AI 上下文管理配置
ai:
  context:
    # Token 预算配置
    total-budget: 4000              # 总预算
    user-message-reserve: 500       # 为用户消息预留

    # 各部分预算分配（按优先级）
    core-profile-budget: 800        # 核心画像（必须）
    relevant-memories-budget: 1200  # 相关记忆（重要）
    conversation-history-budget: 600 # 对话历史（重要）
    extended-profile-budget: 400    # 扩展画像（可选）

    # 记忆检索配置
    memory:
      max-count: 10                 # 最多检索数量
      similarity-threshold: 0.7     # 相似度阈值
      short-term-days: 3            # 短期记忆天数
      mid-term-days: 30             # 中期记忆天数
      enable-deduplication: true    # 启用去重

    # 对话历史配置
    conversation:
      max-rounds: 5                 # 最多保留轮数
      enabled: true                 # 是否启用对话历史

    # 告警配置
    alert:
      enabled: true                 # 是否启用告警
      prompt-tokens-threshold: 6000  # Prompt tokens 告警阈值
      total-tokens-threshold: 28000  # Total tokens 告警阈值

# 对话历史同步配置
chat:
  history:
    sync:
      queue: chat.history.sync.queue
      exchange: chat.history.sync.exchange
      routing-key: chat.history.sync

# Resilience4j 配置
resilience4j:
  circuitbreaker:
    instances:
      sessionContext:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        minimum-number-of-calls: 5

  retry:
    instances:
      sessionContext:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
