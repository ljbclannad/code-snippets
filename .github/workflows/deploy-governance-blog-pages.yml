name: Deploy Blog To GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - codex/ai-multi-agent-platform
    paths:
      - "governance-suite/blog/**"
      - ".github/workflows/deploy-governance-blog-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./governance-suite/blog

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
